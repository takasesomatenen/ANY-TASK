<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BODY N BRAIN</title>
<style>
  :root{
    --bg:#0b0d14; --panel:#141824; --panel2:#1c2130; --line:#2b3245;
    --ink:#e8ecf6; --dim:#8b95ad;
    --blue:#4da3ff; --blue-d:#1e5fa8;
    --red:#ff6b6b;  --red-d:#a83232;
    --gold:#ffcc66; --ok:#5ee6a8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 800px at 50% -10%,#161d2e,var(--bg));
    color:var(--ink); min-height:100vh;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:24px 16px 60px;
  }
  .wrap{width:100%; max-width:1040px}
  header{text-align:center; margin-bottom:22px}
  h1{
    margin:0; font-size:clamp(28px,6vw,46px); letter-spacing:.14em; font-weight:800;
    background:linear-gradient(90deg,var(--blue),#c3a8ff 55%,var(--red));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tag{color:var(--dim); font-size:13px; letter-spacing:.22em; margin-top:6px}

  .cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px; align-items:start}
  @media (max-width:820px){ .cols{grid-template-columns:1fr} }

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px}

  /* ---- board ---- */
  .boardwrap{display:flex; flex-direction:column; align-items:center; gap:12px}
  .status{
    display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px;
    padding:9px 16px; border-radius:999px; background:var(--panel2); border:1px solid var(--line);
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .board{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    background:var(--panel2); padding:10px; border-radius:16px; border:1px solid var(--line);
    width:min(92vw,440px); aspect-ratio:1;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .cell{
    position:relative; border-radius:10px; background:#20263a; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .12s;
  }
  .cell.dark{background:#1a1f31}
  .cell.goal0{box-shadow:inset 0 0 0 2px rgba(77,163,255,.28)}
  .cell.goal1{box-shadow:inset 0 0 0 2px rgba(255,107,107,.28)}
  .cell .coord{position:absolute; left:5px; top:3px; font-size:9px; color:#4d566e; pointer-events:none}
  .cell.sel{background:#2f3a58; box-shadow:inset 0 0 0 2px var(--gold)}
  .cell.lastfrom,.cell.lastto{background:#2a3149}

  .marker{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none}
  .marker i{width:26%; height:26%; border-radius:50%; background:rgba(255,255,255,.30); display:block}
  .marker.cap i{width:82%; height:82%; border-radius:12px; background:transparent; border:3px solid #ff9d3c}
  .marker.mount i{width:82%; height:82%; border-radius:12px; background:transparent; border:3px solid var(--ok)}
  .marker.tack i{
    width:82%; height:82%; border-radius:12px; background:transparent;
    border:3px dashed var(--red); animation:pulse 1.1s infinite;
  }
  @keyframes pulse{50%{opacity:.35}}

  /* ---- pieces ---- */
  .piece{position:relative; width:78%; height:78%; display:flex; align-items:center; justify-content:center}
  .body{
    position:absolute; inset:0; border-radius:12px;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    box-shadow:0 6px 0 var(--c3), 0 10px 16px rgba(0,0,0,.5);
  }
  .brain{
    position:relative; width:52%; height:52%; border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#fff,var(--c1) 62%,var(--c2));
    box-shadow:0 3px 10px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.20);
  }
  .brain::after{
    content:""; position:absolute; inset:26%; border-radius:50%;
    border:2px solid rgba(0,0,0,.28); border-bottom-color:transparent;
  }
  .piece.stacked .brain{transform:translateY(-13%); box-shadow:0 8px 14px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.28)}
  .piece.stacked .body{inset:6% 0 0 0}
  .p0{--c1:#6fb6ff;--c2:#2f74c8;--c3:#17457c}
  .p1{--c1:#ff8f8f;--c2:#d14545;--c3:#8a2626}
  .lonebrain{filter:drop-shadow(0 0 7px rgba(255,255,255,.22))}

  /* ---- controls ---- */
  .modebar{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:38px}
  .modebar .hint{color:var(--dim); font-size:12px; align-self:center}
  button{
    font:inherit; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 13px;
    transition:.12s;
  }
  button:hover{border-color:#4a5570; background:#252b3d}
  button.on{background:var(--gold); color:#20180a; border-color:var(--gold)}
  button:disabled{opacity:.4; cursor:default}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  select{
    font:inherit; font-size:13px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; padding:7px 9px;
  }
  label{font-size:12px; color:var(--dim)}

  h2{font-size:13px; letter-spacing:.16em; color:var(--dim); margin:0 0 10px; font-weight:700}
  .log{height:170px; overflow:auto; font-size:12px; line-height:1.75; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .log div{padding:1px 0; color:var(--dim)}
  .log div.b{color:var(--blue)} .log div.r{color:var(--red)}
  .rules{font-size:12.5px; line-height:1.85; color:#c3cbdd}
  .rules b{color:var(--gold)} .rules code{color:var(--ok)}
  .rules ul{margin:6px 0 12px; padding-left:18px}

  .banner{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(6,8,14,.78); z-index:9; backdrop-filter:blur(3px);
  }
  .banner.show{display:flex}
  .banner .box{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:34px 42px; text-align:center}
  .banner h3{margin:0 0 6px; font-size:30px; letter-spacing:.08em}
  .banner p{margin:0 0 20px; color:var(--dim); font-size:14px; max-width:340px}
  .banner .box button + button{margin-left:10px}
  .log div.meta{color:var(--gold)}
</style>

<body>
<div class="wrap">
  <header>
    <h1>BODY N BRAIN</h1>
    <div class="tag">4 × 4 ・ 乗せると、性質が変わる</div>
  </header>

  <div class="cols">
    <div class="card boardwrap">
      <div class="status"><span class="dot" id="turnDot"></span><span id="turnText">BLUE の手番</span></div>
      <div class="board" id="board"></div>
      <div class="modebar" id="modebar"><span class="hint">駒をクリックして動かします</span></div>
      <div class="row" style="justify-content:center">
        <button id="newGame">新規対局</button>
        <button id="undo">待った</button>
        <label>相手 <select id="opponent">
          <option value="ai">AI (RED)</option>
          <option value="human">人間 (2人対戦)</option>
        </select></label>
        <label><input type="checkbox" id="swapRule" checked> スワップ</label>
        <label>強さ <select id="level">
          <option value="2">やさしい</option>
          <option value="3" selected>ふつう</option>
          <option value="4">つよい</option>
          <option value="5">鬼</option>
        </select></label>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:22px">
      <div class="card">
        <h2>棋譜</h2>
        <div class="log" id="log"></div>
      </div>
      <div class="card">
        <h2>ルール</h2>
        <div class="rules" id="rules"></div>
      </div>
    </div>
  </div>
</div>

<div class="banner" id="banner"><div class="box">
  <h3 id="bannerTitle"></h3><p id="bannerText"></p>
  <button id="bannerBtn">もう一局</button>
  <button id="bannerUndo">待った</button>
</div></div>

<script>
// BODY N BRAIN — rules engine
//
// 4x4 board (16 squares). Two players: 0 = BLUE (先手), 1 = RED (後手).
//
// Cell codes:
//   0 empty
//   1 BODY  of P0     2 BODY  of P1
//   3 BRAIN of P0     4 BRAIN of P1
//   5 STACK of P0     6 STACK of P1   (a BODY carrying its own BRAIN)
//
// Every rule that affects balance is exposed through a `rules` object so the
// balance harness (src/sweep.mjs) can measure variants instead of guessing.

const W = 4;
const H = 4;
const N = W * H;

const EMPTY = 0;
const bodyOf = (p) => 1 + p;
const brainOf = (p) => 3 + p;
const stackOf = (p) => 5 + p;

const ownerOf = (c) => (c === 0 ? -1 : (c - 1) & 1);
const isBody = (c) => c === 1 || c === 2;
const isBrain = (c) => c === 3 || c === 4;
const isStack = (c) => c === 5 || c === 6;

const ORTHO = [
  [1, 0],
  [-1, 0],
  [0, 1],
  [0, -1],
];
const DIAG = [
  [1, 1],
  [1, -1],
  [-1, 1],
  [-1, -1],
];
const ALL8 = [...ORTHO, ...DIAG];

const xOf = (i) => i % W;
const yOf = (i) => (i / W) | 0;
const idx = (x, y) => y * W + x;
const onBoard = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

const FILES = "abcd";
const sqName = (i) => FILES[xOf(i)] + (yOf(i) + 1);

function step(i, dx, dy) {
  const x = xOf(i) + dx;
  const y = yOf(i) + dy;
  return onBoard(x, y) ? idx(x, y) : -1;
}

// ---------------------------------------------------------------------------
// Rules
// ---------------------------------------------------------------------------

// Tuned by self-play sweep (see docs/BALANCE.md). Measured at depth 4 over 180
// low-noise games: first player 53.3%, draws 0%, ~21 plies, with all three win
// mechanics (capture / invasion / judgement) firing regularly.
const DEFAULT_RULES = {
  bodies: 3, // BODY pieces per player (plus exactly one BRAIN)
  stackRange: 2, // how far a whole stack may slide
  stackCapturesStack: true, // a stack may capture another stack outright
  tackle: true, // a BODY may charge a stack and knock the BRAIN off
  invasion: "lone", // 'none' | 'lone' | 'any' — only a dismounted BRAIN scores
  komi: 0.5, // judgement bonus for RED, compensating BLUE's first move
  openingTax: true, // BLUE's first move must be a plain BODY step (no mount)
  redPreMounted: false, // RED starts already combined, BLUE does not
  maxPly: 60,
};

function makeRules(over = {}) {
  return { ...DEFAULT_RULES, ...over };
}

/** Back-rank setup for P0; P1 mirrors it through a 180-degree rotation. */
function backRank(bodies) {
  // index 0..3 == a1..d1
  if (bodies <= 2) return ["B", "R", "B", null];
  if (bodies === 3) return ["B", "R", "B", "B"];
  return ["B", "R", "B", "B"]; // 4 bodies do not fit alongside the brain
}

const goalRank = (p) => (p === 0 ? H - 1 : 0);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

function initialState(rules = DEFAULT_RULES) {
  const cells = new Int8Array(N);
  const pat = backRank(rules.bodies);
  for (let x = 0; x < W; x++) {
    const p = pat[x];
    if (!p) continue;
    cells[x] = p === "B" ? bodyOf(0) : brainOf(0);
    cells[N - 1 - x] = p === "B" ? bodyOf(1) : brainOf(1);
  }
  if (rules.redPreMounted) {
    // RED's BRAIN begins the game already riding one of its BODY pieces, and
    // RED fields one fewer piece on the board as a result. This is the
    // compensation for moving second.
    for (let i = 0; i < N; i++) if (cells[i] === brainOf(1)) cells[i] = stackOf(1);
    for (let i = N - 1; i >= 0; i--) {
      if (cells[i] === bodyOf(1)) {
        cells[i] = EMPTY;
        break;
      }
    }
  }
  return { cells, turn: 0, ply: 0, passes: 0, winner: null, reason: null, rules };
}

function cloneState(s) {
  return {
    cells: Int8Array.from(s.cells),
    turn: s.turn,
    ply: s.ply,
    passes: s.passes,
    winner: s.winner,
    reason: s.reason,
    rules: s.rules,
  };
}

function hashState(s) {
  let h = "";
  for (let i = 0; i < N; i++) h += s.cells[i];
  return h + "|" + s.turn;
}

function hasBrainOnBoard(s, p) {
  const b = brainOf(p);
  const st = stackOf(p);
  for (let i = 0; i < N; i++) if (s.cells[i] === b || s.cells[i] === st) return true;
  return false;
}

/** Is `p`'s BRAIN standing on the enemy home rank in a way that scores? */
function brainOnGoal(s, p) {
  const mode = s.rules.invasion;
  if (mode === "none") return false;
  const y = goalRank(p);
  const lone = brainOf(p);
  const st = stackOf(p);
  for (let x = 0; x < W; x++) {
    const c = s.cells[idx(x, y)];
    if (c === lone) return true;
    if (mode === "any" && c === st) return true;
  }
  return false;
}

/**
 * Positional judgement used when the game stops making progress (3-fold
 * repetition or the ply limit). Shuffling is therefore never a safe way to
 * hold a draw: the player who has pushed their BRAIN deeper — and failing
 * that, the player with more BODY pieces — takes the point.
 *
 * Returns { winner: 0 | 1 | -1, depth: [d0, d1], bodies: [b0, b1] }.
 */
function judge(s) {
  const depth = [0, 0];
  const bodies = [0, 0];
  for (let i = 0; i < N; i++) {
    const c = s.cells[i];
    if (c === 0) continue;
    const o = ownerOf(c);
    if (isBody(c) || isStack(c)) bodies[o] += 1;
    if (isBrain(c) || isStack(c)) depth[o] = H - 1 - Math.abs(yOf(i) - goalRank(o));
  }
  const komi = s.rules.komi || 0;
  let winner = -1;
  if (depth[0] !== depth[1] + komi) winner = depth[0] > depth[1] + komi ? 0 : 1;
  else if (bodies[0] !== bodies[1]) winner = bodies[0] > bodies[1] ? 0 : 1;
  return { winner, depth, bodies, komi };
}

// ---------------------------------------------------------------------------
// Move generation
//
//   'body'    a lone BODY — or the BODY stepping out from under its BRAIN —
//             walks one orthogonal step; captures a lone enemy piece by
//             displacement; sliding onto a friendly lone BRAIN mounts it.
//   'tackle'  a BODY charges an adjacent enemy STACK. The stack is not
//             captured, but its BRAIN is knocked one square further along the
//             charge line. If that square is off the board or occupied, the
//             BRAIN is destroyed. The charging piece never moves.
//   'brain'   a lone BRAIN — or the BRAIN dismounting — slides one diagonal
//             step. It can never capture. Landing on a friendly lone BODY
//             mounts it.
//   'stack'   a whole stack slides up to `stackRange` squares in any of the 8
//             directions without jumping, capturing a lone enemy piece.
// ---------------------------------------------------------------------------

function legalMoves(s, player = s.turn) {
  const c = s.cells;
  const r = s.rules;
  const moves = [];
  const me = player;
  const opp = 1 - player;

  for (let i = 0; i < N; i++) {
    const cell = c[i];
    if (cell === 0 || ownerOf(cell) !== me) continue;
    const stack = isStack(cell);

    if (isBody(cell) || stack) {
      for (const [dx, dy] of ORTHO) {
        const t = step(i, dx, dy);
        if (t < 0) continue;
        const tc = c[t];
        if (tc === 0) {
          moves.push({ kind: "body", from: i, to: t, split: stack });
        } else if (ownerOf(tc) === opp) {
          if (isStack(tc)) {
            if (!r.tackle) continue;
            const push = step(t, dx, dy);
            const blocked = push < 0 || c[push] !== 0;
            moves.push({ kind: "tackle", from: i, target: t, push: blocked ? -1 : push });
          } else {
            moves.push({ kind: "body", from: i, to: t, capture: tc, split: stack });
          }
        } else if (!stack && isBrain(tc)) {
          moves.push({ kind: "body", from: i, to: t, mount: true });
        }
      }
    }

    if (isBrain(cell) || stack) {
      for (const [dx, dy] of DIAG) {
        const t = step(i, dx, dy);
        if (t < 0) continue;
        const tc = c[t];
        if (tc === 0) moves.push({ kind: "brain", from: i, to: t, split: stack });
        else if (ownerOf(tc) === me && isBody(tc))
          moves.push({ kind: "brain", from: i, to: t, mount: true, split: stack });
      }
    }

    if (stack) {
      for (const [dx, dy] of ALL8) {
        let t = i;
        for (let n = 1; n <= r.stackRange; n++) {
          t = step(t, dx, dy);
          if (t < 0) break;
          const tc = c[t];
          if (tc === 0) {
            moves.push({ kind: "stack", from: i, to: t, dist: n });
            continue;
          }
          if (ownerOf(tc) === opp && (!isStack(tc) || r.stackCapturesStack)) {
            moves.push({ kind: "stack", from: i, to: t, dist: n, capture: tc });
          }
          break;
        }
      }
    }
  }

  if (r.openingTax && s.ply === 0 && me === 0) {
    // BLUE pays for the initiative: its opening move must be a plain BODY step
    const taxed = moves.filter((m) => m.kind === "body" && !m.mount);
    if (taxed.length) return taxed;
  }
  return moves;
}

// ---------------------------------------------------------------------------
// Applying moves
// ---------------------------------------------------------------------------

function applyMove(s, m) {
  const n = cloneState(s);
  const c = n.cells;
  const me = s.turn;
  const opp = 1 - me;

  switch (m.kind) {
    case "body":
      c[m.from] = m.split ? brainOf(me) : EMPTY;
      c[m.to] = m.mount ? stackOf(me) : bodyOf(me);
      break;
    case "brain":
      c[m.from] = m.split ? bodyOf(me) : EMPTY;
      c[m.to] = m.mount ? stackOf(me) : brainOf(me);
      break;
    case "stack":
      c[m.from] = EMPTY;
      c[m.to] = stackOf(me);
      break;
    case "tackle":
      // the charging piece never leaves its square
      c[m.target] = bodyOf(opp);
      if (m.push >= 0) c[m.push] = brainOf(opp);
      break;
    case "pass":
      break;
    default:
      throw new Error("unknown move kind: " + m.kind);
  }

  n.ply = s.ply + 1;
  n.passes = m.kind === "pass" ? s.passes + 1 : 0;
  n.turn = opp;

  if (!hasBrainOnBoard(n, opp)) {
    n.winner = me;
    n.reason = "brain";
  } else if (brainOnGoal(n, opp)) {
    // the opponent planted a BRAIN on our home rank and it survived our reply,
    // so they win as their turn begins
    n.winner = opp;
    n.reason = "invasion";
  } else if (n.passes >= 2 || n.ply >= n.rules.maxPly) {
    n.winner = judge(n).winner;
    n.reason = "judgement";
  }
  return n;
}

function movesOrPass(s) {
  const ms = legalMoves(s);
  return ms.length ? ms : [{ kind: "pass" }];
}

const isOver = (s) => s.winner !== null;

function moveText(m) {
  switch (m.kind) {
    case "body":
      return `BODY ${sqName(m.from)}→${sqName(m.to)}${m.mount ? " 合体" : ""}${
        m.capture ? " ×" : ""
      }${m.split ? " 分離" : ""}`;
    case "brain":
      return `BRAIN ${sqName(m.from)}→${sqName(m.to)}${m.mount ? " 合体" : ""}${
        m.split ? " 分離" : ""
      }`;
    case "stack":
      return `MECH ${sqName(m.from)}→${sqName(m.to)}${m.capture ? " ×" : ""}`;
    case "tackle":
      return `TACKLE ${sqName(m.from)}→${sqName(m.target)}${
        m.push < 0 ? " 撃墜!!" : ` (BRAIN→${sqName(m.push)})`
      }`;
    case "pass":
      return "パス";
  }
  return "?";
}
// BODY N BRAIN — evaluation + alpha-beta search

const WIN = 100000;

// Distance from the nearest wall: 0 on the rim, 1 in the 2x2 centre.
const RIM = new Int8Array(N);
for (let i = 0; i < N; i++) {
  const x = xOf(i);
  const y = yOf(i);
  RIM[i] = Math.min(x, 3 - x, y, 3 - y);
}

const V_BODY = 100;
const V_STACK_BONUS = 55; // being mounted is worth roughly half a BODY
const V_CENTRE = 8;
const V_MOBILITY = 3;
const V_LONE_BRAIN = -30; // an unmounted BRAIN is a liability
const V_WALL_BRAIN = -22; // a mounted BRAIN on the rim can be tackled off the board
const V_ADVANCE = 14; // per rank the BRAIN has pushed toward the enemy home rank
const V_ON_GOAL = 220; // sitting on the goal rank: one survived turn from winning

/** Static evaluation from the point of view of `me`. */
function evaluate(s, me) {
  if (s.winner !== null) {
    if (s.winner === -1) return 0;
    return s.winner === me ? WIN : -WIN;
  }
  const c = s.cells;
  let score = 0;
  for (let i = 0; i < N; i++) {
    const cell = c[i];
    if (cell === 0) continue;
    const o = ownerOf(cell);
    const sign = o === me ? 1 : -1;
    let v = 0;
    if (isBody(cell)) v += V_BODY;
    else if (isBrain(cell)) v += V_LONE_BRAIN;
    else if (isStack(cell)) {
      v += V_BODY + V_STACK_BONUS;
      if (RIM[i] === 0) v += V_WALL_BRAIN;
    }
    if (s.rules.invasion !== "none" && (isBrain(cell) || isStack(cell))) {
      const scores = s.rules.invasion === "any" || isBrain(cell);
      const progress = 3 - Math.abs(yOf(i) - goalRank(o));
      v += V_ADVANCE * progress;
      if (progress === 3 && scores) v += V_ON_GOAL;
    }
    v += V_CENTRE * RIM[i];
    score += sign * v;
  }
  // mobility of the side to move (cheap proxy for initiative)
  const mob = legalMoves(s, s.turn).length;
  score += (s.turn === me ? 1 : -1) * V_MOBILITY * mob;
  return score;
}

function scoreMove(s, m) {
  // cheap move ordering: wins first, then captures, then tackles
  if (m.kind === "tackle") return m.push < 0 ? 9000 : 400;
  if (m.capture) return isBrain(m.capture) ? 9000 : 500;
  if (m.mount) return 200;
  return 0;
}

function search(s, depth, me, alpha = -Infinity, beta = Infinity) {
  if (isOver(s) || depth === 0) return { score: evaluate(s, me), move: null };

  const moves = movesOrPass(s);
  moves.sort((a, b) => scoreMove(s, b) - scoreMove(s, a));

  const maximizing = s.turn === me;
  let best = null;
  let bestScore = maximizing ? -Infinity : Infinity;

  for (const m of moves) {
    const ns = applyMove(s, m);
    const r = search(ns, depth - 1, me, alpha, beta);
    // prefer faster wins / slower losses
    const sc = r.score > WIN / 2 ? r.score - 1 : r.score < -WIN / 2 ? r.score + 1 : r.score;
    if (maximizing) {
      if (sc > bestScore) (bestScore = sc), (best = m);
      alpha = Math.max(alpha, bestScore);
    } else {
      if (sc < bestScore) (bestScore = sc), (best = m);
      beta = Math.min(beta, bestScore);
    }
    if (beta <= alpha) break;
  }
  return { score: bestScore, move: best };
}

/**
 * Pick a move for the side to move.
 * `temperature` (0..1) mixes in near-optimal alternatives so that repeated
 * self-play games do not all follow the same line.
 */
function chooseMove(s, depth, rng = Math.random, temperature = 0) {
  const me = s.turn;
  const moves = movesOrPass(s);
  if (moves.length === 1) return moves[0];
  const scored = moves.map((m) => {
    const ns = applyMove(s, m);
    const r = search(ns, depth - 1, me);
    return { m, score: r.score };
  });
  scored.sort((a, b) => b.score - a.score);
  if (temperature <= 0) {
    const top = scored.filter((x) => x.score === scored[0].score);
    return top[(rng() * top.length) | 0].m;
  }
  const slack = temperature * 60;
  const pool = scored.filter((x) => x.score >= scored[0].score - slack);
  return pool[(rng() * pool.length) | 0].m;
}

/** Squares from which an enemy BODY could tackle the stack at `i` fatally. */
function fatalTackleSquares(s, i) {
  const out = [];
  for (const [dx, dy] of ORTHO) {
    const fx = xOf(i) - dx;
    const fy = yOf(i) - dy;
    if (!onBoard(fx, fy)) continue;
    const px = xOf(i) + dx;
    const py = yOf(i) + dy;
    const blocked = !onBoard(px, py) || s.cells[idx(px, py)] !== 0;
    if (blocked) out.push(idx(fx, fy));
  }
  return out;
}
// BODY N BRAIN — browser UI. Inlined into index.html by build.mjs.

const $ = (id) => document.getElementById(id);
const boardEl = $("board");
const logEl = $("log");
const modebarEl = $("modebar");

const RULES = makeRules();

let state, history, sel, mode, lastMove, repeats, busy;
// Seat the AI occupies. The swap (pie) rule can hand it the other colour.
let aiSide, swapPending, swapUsed;

const MODES = [
  { key: "stack", label: "合体駒で動く" },
  { key: "brain", label: "BRAIN だけ降りる" },
  { key: "body", label: "BODY だけ出る" },
];

function newGame() {
  state = initialState(RULES);
  history = [];
  repeats = new Map();
  sel = null;
  mode = "stack";
  lastMove = null;
  busy = false;
  aiSide = 1;
  swapPending = false;
  swapUsed = false;
  logEl.innerHTML = "";
  $("banner").classList.remove("show");
  render();
}

const vsAI = () => $("opponent").value === "ai";
const aiToMove = () => vsAI() && state.turn === aiSide;

// --- move helpers ----------------------------------------------------------

function movesFrom(i) {
  return legalMoves(state).filter((m) => m.from === i);
}

/** Moves offered for the current selection, filtered by the active mode. */
function offered() {
  if (sel === null) return [];
  const all = movesFrom(sel);
  if (!isStack(state.cells[sel])) return all;
  if (mode === "stack") return all.filter((m) => m.kind === "stack" || m.kind === "tackle");
  if (mode === "brain") return all.filter((m) => m.kind === "brain");
  return all.filter((m) => m.kind === "body" || m.kind === "tackle");
}

const targetOf = (m) => (m.kind === "tackle" ? m.target : m.to);

// --- rendering -------------------------------------------------------------

function pieceHTML(c) {
  const p = ownerOf(c);
  const cls = `piece p${p}`;
  if (isBody(c)) return `<div class="${cls}"><div class="body"></div></div>`;
  if (isBrain(c)) return `<div class="${cls} lonebrain"><div class="brain"></div></div>`;
  return `<div class="${cls} stacked"><div class="body"></div><div class="brain"></div></div>`;
}

function render() {
  const marks = new Map();
  for (const m of offered()) marks.set(targetOf(m), m);

  boardEl.innerHTML = "";
  for (let y = H - 1; y >= 0; y--) {
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const cell = document.createElement("div");
      cell.className = "cell" + ((x + y) % 2 ? " dark" : "");
      if (y === goalRank(0)) cell.className += " goal0";
      if (y === goalRank(1)) cell.className += " goal1";
      if (i === sel) cell.className += " sel";
      if (lastMove && (lastMove.from === i || targetOf(lastMove) === i)) cell.className += " lastto";

      let html = `<span class="coord">${sqName(i)}</span>`;
      const c = state.cells[i];
      if (c !== 0) html += pieceHTML(c);
      const m = marks.get(i);
      if (m) {
        const kind = m.kind === "tackle" ? "tack" : m.capture || m.mount ? "cap" : "";
        html += `<span class="marker ${kind}"><i></i></span>`;
      }
      cell.innerHTML = html;
      cell.onclick = () => onCell(i);
      boardEl.appendChild(cell);
    }
  }

  const p = state.turn;
  $("turnDot").style.background = p === 0 ? "var(--blue)" : "var(--red)";
  const who = vsAI() ? (p === aiSide ? "AI" : "あなた") : p === 0 ? "先手" : "後手";
  $("turnText").textContent = `${p === 0 ? "BLUE" : "RED"} の手番 — ${who}`;
  $("undo").disabled = history.length === 0 || busy || swapPending;
  renderModebar();
}

function renderModebar() {
  modebarEl.innerHTML = "";
  if (swapPending) {
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = "スワップ権：先手の初手を見て、盤ごと入れ替われます　";
    modebarEl.appendChild(hint);
    for (const [label, doSwap] of [
      ["入れ替える", true],
      ["このまま", false],
    ]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => resolveSwap(doSwap);
      modebarEl.appendChild(b);
    }
    return;
  }
  if (sel === null || !isStack(state.cells[sel])) {
    const s = document.createElement("span");
    s.className = "hint";
    s.textContent =
      state.ply === 0 && RULES.openingTax
        ? "先手の初手は BODY を1マス動かすだけ（先手のコミ）"
        : sel === null
        ? "駒をクリックして動かします"
        : "行き先をクリック（合体駒は動き方を選べます）";
    modebarEl.appendChild(s);
    return;
  }
  for (const md of MODES) {
    const b = document.createElement("button");
    b.textContent = md.label;
    if (md.key === mode) b.className = "on";
    const has = movesFrom(sel).some((m) =>
      md.key === "stack"
        ? m.kind === "stack" || m.kind === "tackle"
        : md.key === "brain"
        ? m.kind === "brain"
        : m.kind === "body" || m.kind === "tackle"
    );
    b.disabled = !has;
    b.onclick = () => {
      mode = md.key;
      render();
    };
    modebarEl.appendChild(b);
  }
}

function logMove(player, m) {
  const d = document.createElement("div");
  d.className = player === 0 ? "b" : "r";
  d.textContent = `${String(Math.floor(state.ply / 2) + 1).padStart(2, " ")}. ${
    player === 0 ? "B" : "R"
  }  ${moveText(m)}`;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

// --- interaction -----------------------------------------------------------

function resolveSwap(doSwap) {
  swapPending = false;
  swapUsed = true;
  if (doSwap) {
    aiSide = 1 - aiSide;
    const d = document.createElement("div");
    d.className = "meta";
    d.textContent = "   — スワップ発動：両者の陣営が入れ替わりました —";
    logEl.appendChild(d);
  }
  render();
  if (aiToMove()) aiTurn();
}

function onCell(i) {
  if (busy || swapPending || isOver(state)) return;
  const m = offered().find((mv) => targetOf(mv) === i);
  if (m) return void play(m);

  const c = state.cells[i];
  if (c !== 0 && ownerOf(c) === state.turn) {
    sel = i;
    const kinds = new Set(movesFrom(i).map((x) => x.kind));
    mode = kinds.has("stack") ? "stack" : kinds.has("brain") ? "brain" : "body";
  } else {
    sel = null;
  }
  render();
}

function play(m) {
  const player = state.turn;
  history.push(state);
  logMove(player, m);
  state = applyMove(state, m);
  lastMove = m;
  sel = null;

  const h = hashState(state);
  const n = (repeats.get(h) || 0) + 1;
  repeats.set(h, n);
  if (n >= 3 && !isOver(state)) {
    state = { ...state, winner: judge(state).winner, reason: "repetition" };
  }

  render();
  if (isOver(state)) return void finish();

  // The swap (pie) rule: having seen BLUE's opening move, the second player may
  // take the BLUE side instead. This is what actually neutralises the
  // first-move advantage — see docs/BALANCE.md.
  if ($("swapRule").checked && !swapUsed && state.ply === 1) {
    if (vsAI() && state.turn === aiSide) return void aiSwapDecision();
    swapPending = true;
    return void render();
  }

  if (!legalMoves(state).length) return void setTimeout(() => play({ kind: "pass" }), 350);
  if (aiToMove()) aiTurn();
}

function aiSwapDecision() {
  busy = true;
  render();
  setTimeout(() => {
    const depth = Math.max(2, Number($("level").value) - 1);
    // Take the swap when the position already looks better for the side that
    // has just moved.
    const take = search(state, depth, 1 - state.turn).score > 0;
    busy = false;
    resolveSwap(take);
  }, 260);
}

function aiTurn() {
  busy = true;
  render();
  setTimeout(() => {
    const depth = Number($("level").value);
    const m = chooseMove(state, depth, Math.random, depth <= 2 ? 0.5 : 0.06);
    busy = false;
    play(m);
  }, 220);
}

const REASONS = {
  brain: "相手の BRAIN を捕獲しました。",
  invasion: "BRAIN が敵陣に降り立ち、生き延びました。",
  repetition: "千日手 — 判定で決着しました。",
  judgement: "手数切れ — 判定で決着しました。",
};

function finish() {
  const w = state.winner;
  const j = judge(state);
  $("bannerTitle").textContent = w === -1 ? "引き分け" : (w === 0 ? "BLUE" : "RED") + " の勝ち";
  $("bannerTitle").style.color = w === -1 ? "var(--gold)" : w === 0 ? "var(--blue)" : "var(--red)";
  const detail =
    state.reason === "repetition" || state.reason === "judgement"
      ? `（侵攻度 ${j.depth[0]} 対 ${j.depth[1]}＋コミ${j.komi}、BODY ${j.bodies[0]} 対 ${j.bodies[1]}）`
      : "";
  $("bannerText").textContent = (REASONS[state.reason] || "") + detail;
  $("banner").classList.add("show");
}

function popOne() {
  state = history.pop();
  while (logEl.lastChild && logEl.lastChild.className === "meta") logEl.removeChild(logEl.lastChild);
  if (logEl.lastChild) logEl.removeChild(logEl.lastChild);
}

function undo() {
  if (!history.length || busy || swapPending) return;
  popOne();
  while (history.length && aiToMove()) popOne();
  sel = null;
  lastMove = null;
  $("banner").classList.remove("show");
  render();
}

$("newGame").onclick = newGame;
$("bannerBtn").onclick = newGame;
$("undo").onclick = undo;
$("bannerUndo").onclick = () => {
  $("banner").classList.remove("show");
  undo();
};
$("opponent").onchange = newGame;
$("banner").onclick = (e) => {
  if (e.target === $("banner")) $("banner").classList.remove("show");
};

$("rules").innerHTML = `
<b>目的</b>
<ul>
  <li>相手の <b>BRAIN</b> を捕獲する</li>
  <li>または、単体の <b>BRAIN</b> を相手の最奥段に置き、相手の1手を生き延びる（<b>侵攻勝ち</b>）</li>
</ul>
<b>動き</b>
<ul>
  <li><b>BODY</b>（四角）… 縦横に1マス。単体の敵駒を取れる。</li>
  <li><b>BRAIN</b>（丸）… 斜めに1マス。<code>絶対に駒を取れない</code>。</li>
  <li><b>合体駒</b>（BRAIN が BODY に乗った状態）… 8方向に最大2マス滑る。飛び越え不可。</li>
</ul>
<b>合体と分離</b>
<ul>
  <li>BRAIN が味方 BODY のマスへ入る／BODY が味方 BRAIN のマスへ入ると <b>合体</b>。</li>
  <li>合体駒からは「BRAIN だけ降りる」「BODY だけ出る」も選べる（<b>分離</b>）。</li>
</ul>
<b>タックル</b>
<ul>
  <li>BODY は隣接する敵の合体駒へ突撃できる。合体駒は取れないが、
      上の BRAIN が突撃方向へ1マス <b>叩き落とされる</b>。
      その先が盤外か塞がっていれば BRAIN は <code>撃墜＝負け</code>。突撃側は動かない。</li>
</ul>
<b>判定</b>
<ul>
  <li>千日手・${RULES.maxPly}手到達は <b>判定</b>：BRAIN がより深く侵攻している側の勝ち。
      同じなら BODY の多い側。後手には <b>コミ ${RULES.komi}</b> が付く。</li>
</ul>
<b>先手・後手の調整</b>
<ul>
  <li><b>先手の初手</b>は BODY を1マス動かすだけ（合体・侵攻の禁止）。</li>
  <li><b>スワップ</b>：後手は先手の初手を見てから、盤ごと陣営を入れ替えられる。
      先手が有利な初手を指すほど、奪われる。真剣勝負ではこれを推奨。</li>
</ul>`;

newGame();
