<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BODY N BRAIN</title>
<style>
  /* Monochrome by design: the two sides are told apart by fill, not hue —
     solid pieces are BLACK, outlined pieces are WHITE. Every colour is a token
     so the same drawing works on a light or a dark ground. */
  :root{
    --paper:#ffffff;
    --soft:#f3f3f5;
    --line:#d6d6dc;
    --ink:#15151a;
    --muted:#74747f;
    --grid:1px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e0e11;
      --soft:#17171c;
      --line:#33333c;
      --ink:#f0f0f3;
      --muted:#8b8b96;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e0e11;
    --soft:#17171c;
    --line:#33333c;
    --ink:#f0f0f3;
    --muted:#8b8b96;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background-color:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",
                -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.75;
    display:flex; justify-content:center; padding:32px 16px 64px;
  }
  .wrap{width:100%; max-width:940px; display:flex; flex-direction:column; gap:26px}

  header{text-align:center; display:flex; flex-direction:column; gap:8px}
  h1{
    margin:0; font-size:clamp(22px,5vw,34px); font-weight:700;
    letter-spacing:.30em; text-indent:.30em; text-wrap:balance;
  }
  .tag{
    color:var(--muted); font-size:11px; letter-spacing:.20em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .cols{display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:28px; align-items:start}
  @media (max-width:880px){ .cols{grid-template-columns:1fr} }

  .stage{display:flex; flex-direction:column; align-items:center; gap:16px}

  /* --- instruction / status bar --- */
  .bar{
    width:100%; max-width:520px; min-height:64px;
    border:var(--grid) solid var(--line); border-radius:2px;
    padding:12px 16px; display:flex; gap:14px; align-items:center;
  }
  .bar.teach{border-color:var(--ink); border-width:2px}
  .step{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    letter-spacing:.1em; color:var(--muted); white-space:nowrap; padding-top:2px;
  }
  .bar p{margin:0; font-size:13px; line-height:1.7}
  .bar b{font-weight:700}
  .turnmark{width:16px; height:16px; flex:0 0 16px; border:2px solid var(--ink); border-radius:50%}
  .turnmark.solid{background:var(--ink)}

  /* --- board --- */
  .board{
    display:grid; width:min(100%,480px); aspect-ratio:1;
    border:2px solid var(--ink); background:var(--line);
    gap:var(--grid);
  }
  .cell{
    position:relative; background:var(--paper); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cell.alt{background:var(--soft)}
  .cell.goal::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);
    opacity:.9; pointer-events:none;
  }
  .cell .coord{
    position:absolute; left:3px; top:1px; font-size:8px; color:var(--muted); opacity:.55;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; pointer-events:none;
  }
  .cell.sel{outline:3px solid var(--ink); outline-offset:-3px}
  .cell.last{background:var(--soft)}
  .cell.last.alt{background:var(--paper)}
  .cell.teachtarget{animation:blink 1.4s infinite}
  @keyframes blink{50%{background:var(--soft)}}

  /* --- pieces: solid = BLACK, outlined = WHITE --- */
  .piece{position:relative; width:72%; height:72%}
  .pbody{
    position:absolute; left:0; right:0; bottom:0; top:0; border-radius:2px;
    border:2px solid var(--ink);
  }
  .pbrain{
    position:absolute; left:50%; width:46%; aspect-ratio:1; transform:translateX(-50%);
    top:27%; border-radius:50%; border:2px solid var(--ink); background:var(--paper);
  }
  .p0 .pbody{background:var(--ink)}
  .p0 .pbrain{background:var(--ink)}
  .p1 .pbody{background:var(--paper)}
  .p1 .pbrain{background:var(--paper)}
  /* a solid BRAIN needs a rim so it stays visible on top of a solid BODY */
  .stacked .pbody{top:16%}
  .stacked .pbrain{top:-4%; box-shadow:0 0 0 3px var(--paper)}
  .p1.stacked .pbrain{box-shadow:0 0 0 3px var(--ink)}
  .lone .pbrain{top:27%}

  /* --- move markers: shape-coded, since colour is not available.
     Each carries a paper-coloured halo so it stays readable when it lands on
     top of a solid piece. --- */
  .mk{position:absolute; inset:0; pointer-events:none; z-index:2;
      display:flex; align-items:center; justify-content:center}
  .mk-move i{
    display:block; width:18%; aspect-ratio:1; border-radius:50%;
    background:var(--ink); box-shadow:0 0 0 2px var(--paper);
  }
  .mk-mount i, .mk-mount i::after{
    display:block; border:2px solid var(--ink); border-radius:50%;
    box-shadow:0 0 0 2px var(--paper), inset 0 0 0 2px var(--paper);
  }
  .mk-mount i{width:70%; aspect-ratio:1; position:relative}
  .mk-mount i::after{content:""; position:absolute; inset:24%}
  .mk-take i, .mk-take i::after{
    display:block; width:70%; height:3px; border-radius:2px;
    background:var(--ink); box-shadow:0 0 0 2px var(--paper);
  }
  .mk-take i{transform:rotate(45deg); position:relative}
  /* width:100% keeps the second stroke exactly as long as the first */
  .mk-take i::after{content:""; position:absolute; left:0; top:0; width:100%; transform:rotate(-90deg)}
  .mk-tackle i{
    display:block; width:78%; aspect-ratio:1;
    border:3px dashed var(--ink); border-radius:2px;
    box-shadow:0 0 0 2px var(--paper), inset 0 0 0 2px var(--paper);
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{50%{opacity:.3}}

  /* --- controls --- */
  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
  button{
    font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer;
    background:var(--paper); border:var(--grid) solid var(--line); border-radius:2px;
    padding:8px 14px;
  }
  button:hover:not(:disabled){border-color:var(--ink)}
  button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  button:disabled{opacity:.35; cursor:default}
  select{
    font:inherit; font-size:12.5px; background:var(--paper); color:var(--ink);
    border:var(--grid) solid var(--line); border-radius:2px; padding:7px 8px;
  }
  label{font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:5px}
  .modebar{min-height:34px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
  .hint{color:var(--muted); font-size:12px; text-align:center}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* --- side panels --- */
  .panel{border:var(--grid) solid var(--line); border-radius:2px; padding:14px 16px}
  .panel + .panel{margin-top:20px}
  h2{
    font-size:10.5px; letter-spacing:.18em; color:var(--muted); margin:0 0 10px;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .log{
    height:150px; overflow:auto; font-size:11.5px; line-height:1.85;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums;
  }
  .log div{color:var(--muted)}
  .log div.b{color:var(--ink)}
  .log div.meta{font-style:italic}
  .rules{font-size:12.5px; line-height:1.9}
  .rules dt{font-weight:700; margin-top:11px}
  .rules dd{margin:1px 0 0; color:var(--muted)}
  .rules dl{margin:0}

  .legend{display:grid; grid-template-columns:auto 1fr; gap:7px 11px; align-items:center; font-size:11.5px; color:var(--muted)}
  .legend .sw{
    position:relative; width:28px; height:28px; border:var(--grid) solid var(--line);
    display:flex; align-items:center; justify-content:center; flex:0 0 28px;
  }
  .legend .sw .piece{width:64%; height:64%}

  /* --- overlay --- */
  .veil{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--paper) 82%, transparent); z-index:9; padding:20px;
  }
  .veil.show{display:flex}
  .veil .box{
    background:var(--paper); border:2px solid var(--ink); border-radius:2px;
    padding:30px 34px; text-align:center; max-width:400px;
  }
  .veil h3{margin:0 0 8px; font-size:20px; letter-spacing:.06em}
  .veil p{margin:0 0 20px; color:var(--muted); font-size:13px}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
    .mk-tackle i{border-style:solid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BODY N BRAIN</h1>
    <div class="tag" id="tagline">6 × 6 — STACK TO CHANGE WHAT A PIECE IS</div>
  </header>

  <div class="cols">
    <div class="stage">
      <div class="bar" id="bar"></div>
      <div class="board" id="board"></div>
      <div class="modebar" id="modebar"></div>
      <div class="row">
        <button id="newGame">新規対局</button>
        <button id="undo">待った</button>
        <button id="teach">チュートリアル</button>
        <label>相手 <select id="opponent">
          <option value="ai">AI</option>
          <option value="human">人間 2人</option>
        </select></label>
        <label>強さ <select id="level">
          <option value="2">やさしい</option>
          <option value="3" selected>ふつう</option>
          <option value="4">つよい</option>
        </select></label>
        <label><input type="checkbox" id="swapRule" checked> スワップ</label>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>記号</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel">
        <h2>ルール</h2>
        <div class="rules" id="rules"></div>
      </div>
      <div class="panel">
        <h2>棋譜</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="veil"><div class="box">
  <h3 id="veilTitle"></h3><p id="veilText"></p>
  <div class="row" id="veilBtns"></div>
</div></div>

</script>
</body>
</html>
